version: v1.1.0

dsn: ${DSN}

courier:
  smtp:
    connection_uri: ${COURIER_SMTP_CONNECTION_URI}
    from_address: ${COURIER_SMTP_FROM_ADDRESS}
    from_name: ${COURIER_SMTP_FROM_NAME}

log:
  level: info
  format: text

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 8

serve:
  public:
    # IMPORTANT: base_url must be the PUBLIC gateway URL + /.ory prefix.
    # Kratos constructs OIDC callback URLs as:
    #   ${base_url}/self-service/methods/oidc/callback/<provider>
    # nginx rewrites /.ory/X → /X before forwarding to Kratos (port 4433), so
    # the public-facing URL must include /.ory so that SimpleLogin/Proton and
    # any other OIDC providers can redirect back via the gateway correctly.
    #
    # Correct Railway value: https://<your-gateway-domain>/.ory
    # Example: ORY_KRATOS_PUBLIC_URL=https://gateway-production-6cac.up.railway.app/.ory
    #
    # Then register this callback URI in SimpleLogin's OIDC client:
    #   https://<gateway-domain>/.ory/self-service/methods/oidc/callback/simplelogin
    base_url: ${ORY_KRATOS_PUBLIC_URL}
    host: 0.0.0.0
    port: 4433
    cors:
      enabled: true
      allowed_origins:
        - ${CORS_ALLOWED_ORIGIN}
      allowed_methods: [GET, POST, PUT, PATCH, DELETE]
      allowed_headers:
        - Authorization
        - Cookie
        - Content-Type
        - X-CSRF-Token
      exposed_headers: [Content-Type, Set-Cookie]
      allow_credentials: true

  # Admin API - accessible only via private network
  admin:
    host: 0.0.0.0
    port: 4434

secrets:
  default:
    - ${SECRETS_DEFAULT}
  cookie:
    - ${SECRETS_COOKIE}
  cipher:
    - ${SECRETS_CIPHER}

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/kratos/identity.schema.json

session:
  lifespan: 24h
  cookie:
    same_site: None
    path: /
    domain: ${COOKIE_DOMAIN}
    persistent: true

selfservice:
  default_browser_return_url: ${DEFAULT_RETURN_URL}
  allowed_return_urls:
    - ${ALLOWED_RETURN_URL}

  methods:
    oidc:
      enabled: true
      config:
        providers:
          - id: simplelogin
            provider: generic
            label: Proton
            client_id: ${SIMPLELOGIN_CLIENT_ID}
            client_secret: ${SIMPLELOGIN_CLIENT_SECRET}
            issuer_url: https://app.simplelogin.io
            mapper_url: base64:
            scope:
              - openid
              - email
              - profile
            requested_claims:
              id_token:
                email:
                  essential: true
                email_verified:
                  essential: false
    password:
      enabled: true
    totp:
      enabled: true
    lookup_secret:
      enabled: true
    link:
      enabled: true

    # Allow users to log in using OTP magic codes
    code:
      enabled: true
      passwordless_enabled: true

    # Allow users to update their profile settings
    profile:
      enabled: true

    # Enable Security Keys (YubiKey, etc.)
    webauthn:
      enabled: true
      config:
        passwordless: true
        rp:
          display_name: IAM-Platform
          id: ${COOKIE_DOMAIN}
          # Must be a bare origin (scheme://host) — ORY_KRATOS_PUBLIC_URL includes
          # the /.ory path prefix required for OIDC callbacks, making it invalid here.
          origin: ${CORS_ALLOWED_ORIGIN}

    # Enable Passkeys (FaceID, Windows Hello, etc.)
    passkey:
      enabled: true
      config:
        rp:
          display_name: IAM-Platform
          id: ${COOKIE_DOMAIN}
          origins:
            - ${CORS_ALLOWED_ORIGIN}

  flows:
    error:
      ui_url: ${KRATOS_UI_URL}/auth/error

    login:
      ui_url: ${KRATOS_UI_URL}/auth/login
      lifespan: 10m

    registration:
      ui_url: ${KRATOS_UI_URL}/auth/registration
      lifespan: 10m
      enable_legacy_one_step: true # Kratos v1.2+ defaults to two-step; keep single-step form
      after:
        default_browser_return_url: ${DEFAULT_RETURN_URL}

        # Auto-login users after successful Passkey/WebAuthn registration
        passkey:
          hooks:
            - hook: session
        webauthn:
          hooks:
            - hook: session

        password:
          hooks:
            - hook: session # Auto-login users after password registration
            - hook: web_hook
              config:
                url: ${KRATOS_UI_URL}/api/auth/registration-hook
                method: POST
                body: base64://ZnVuY3Rpb24oY3R4KSB7ICJpZGVudGl0eSI6IGN0eC5pZGVudGl0eSwgImZsb3ciOiBjdHguZmxvdyB9
                response:
                  ignore: true # Don't abort registration if webhook fails

        oidc:
          hooks:
            - hook: session
            - hook: web_hook
              config:
                url: ${KRATOS_UI_URL}/api/auth/registration-hook
                method: POST
                body: base64://ZnVuY3Rpb24oY3R4KSB7ICJpZGVudGl0eSI6IGN0eC5pZGVudGl0eSwgImZsb3ciOiBjdHguZmxvdyB9
                response:
                  ignore: true

        code:
          hooks:
            - hook: session
            - hook: web_hook
              config:
                url: ${KRATOS_UI_URL}/api/auth/registration-hook
                method: POST
                body: base64://ZnVuY3Rpb24oY3R4KSB7ICJpZGVudGl0eSI6IGN0eC5pZGVudGl0eSwgImZsb3ciOiBjdHguZmxvdyB9
                response:
                  ignore: true

    settings:
      ui_url: ${KRATOS_UI_URL}/auth/settings
      privileged_session_max_age: 15m
      required_aal: highest_available

    recovery:
      enabled: true
      ui_url: ${KRATOS_UI_URL}/auth/recovery
      use: code # Forces Kratos to issue a 6-digit code instead of a magic link

    verification:
      enabled: true
      ui_url: ${KRATOS_UI_URL}/auth/verification
      use: code # Forces Kratos to issue a 6-digit code instead of a magic link

    logout:
      after:
        default_browser_return_url: ${DEFAULT_RETURN_URL}
