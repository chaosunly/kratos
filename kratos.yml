version: v1.1.0

dsn: ${DSN}

courier:
  smtp:
    connection_uri: ${COURIER_SMTP_CONNECTION_URI}
    from_address: ${COURIER_SMTP_FROM_ADDRESS}
    from_name: ${COURIER_SMTP_FROM_NAME}

log:
  level: info
  format: text

serve:
  public:
    base_url: ${ORY_KRATOS_PUBLIC_URL}
    host: 0.0.0.0
    port: 4433
    cors:
      enabled: true
      allowed_origins:
        - ${CORS_ALLOWED_ORIGIN}
      allowed_methods: [GET, POST, PUT, PATCH, DELETE]
      allowed_headers:
        - Authorization
        - Cookie
        - Content-Type
        - X-CSRF-Token
      exposed_headers: [Content-Type, Set-Cookie]
      allow_credentials: true

  # Admin API - accessible only via private network
  admin:
    host: 0.0.0.0
    port: 4434

secrets:
  default:
    - ${SECRETS_DEFAULT}
  cookie:
    - ${SECRETS_COOKIE}

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/kratos/identity.schema.json

session:
  lifespan: 24h
  cookie:
    same_site: Lax
    path: /
    domain: ${COOKIE_DOMAIN}
    persistent: true

selfservice:
  default_browser_return_url: ${DEFAULT_RETURN_URL}
  allowed_return_urls:
    - ${ALLOWED_RETURN_URL}

  methods:
    oidc:
      enabled: true
      config:
        providers:
          - id: simplelogin
            provider: generic
            label: SimpleLogin
            client_id: simpleloginwithkratos-ntjbamhswk
            client_secret: eveyrwoytnubxzvlhylxoagsppithespughussps
            issuer_url: https://app.simplelogin.io
            mapper_url: base64://ewogICJpZGVudGl0eSI6IHsKICAgICJ0cmFpdHMiOiB7CiAgICAgICJlbWFpbCI6ICJ7eyBjbGFpbXMuZW1haWwgfX0iLAogICAgICAibmFtZSI6IHsKICAgICAgICAiZmlyc3QiOiAie3sgY2xhaW1zLm5hbWUgfX0iCiAgICAgIH0KICAgIH0KICB9Cn0=
            scope:
              - openid
              - email
              - profile
    password:
      enabled: true
    totp:
      enabled: true
    lookup_secret:
      enabled: true
    link:
      enabled: true
    code:
      enabled: true

  flows:
    error:
      ui_url: ${KRATOS_UI_URL}/auth/error

    login:
      ui_url: ${KRATOS_UI_URL}/auth/login
      lifespan: 10m

    registration:
      ui_url: ${KRATOS_UI_URL}/auth/registration
      lifespan: 10m
      after:
        password:
          hooks:
            - hook: web_hook
              config:
                url: ${KRATOS_UI_URL}/api/auth/registration-hook
                method: POST
                body: base64://eyJpZGVudGl0eSI6IHt9fQ==

    settings:
      ui_url: ${KRATOS_UI_URL}/auth/settings
      privileged_session_max_age: 15m

    recovery:
      enabled: true
      ui_url: ${KRATOS_UI_URL}/auth/recovery

    verification:
      enabled: true
      ui_url: ${KRATOS_UI_URL}/auth/verification

    logout:
      after:
        default_browser_return_url: ${DEFAULT_RETURN_URL}
